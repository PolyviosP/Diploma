# Development stack — hot reload μέσα σε container.
#   docker compose -f docker-compose.dev.yml up
#
# Το production compose (docker-compose.yml) μένει ανέπαφο· τα δύο αρχεία δεν
# συνδυάζονται, διαλέγεις ένα από τα δύο.

services:
  # Ίδια εικόνα και ίδιος named volume με το docker-compose.yml, οπότε τα δεδομένα
  # είναι τα ίδια είτε τρέξεις dev είτε prod.
  postgres:
    image: postgres:16.4-alpine
    container_name: diploma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diploma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diploma}
      POSTGRES_DB: ${POSTGRES_DB:-diploma}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diploma} -d ${POSTGRES_DB:-diploma}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ίδιος IdP με το docker-compose.yml — ίδιο realm, ίδιοι χρήστες επίδειξης.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: diploma-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Ίδιο MinIO και ίδιος named volume με το docker-compose.yml.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: diploma-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-diploma}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-diploma-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-diploma-app-secret}
    entrypoint: ["/bin/bash", "/init/init.sh"]
    volumes:
      - ./minio:/init:ro

  # Ίδιο one-shot service με το docker-compose.yml: χωρίς αυτό η διαδρομή Γ
  # ξεκινά με άδεια βάση σε καθαρό μηχάνημα.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: diploma-migrate
    container_name: diploma-migrate-dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-diploma}:${POSTGRES_PASSWORD:-diploma}@postgres:5432/${POSTGRES_DB:-diploma}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-diploma}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-diploma-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-diploma-app-secret}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: dev
    container_name: dev
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      # Ο πηγαίος κώδικας από τον host — κάθε αλλαγή φαίνεται αμέσως.
      - .:/app
      # Anonymous volumes: σκιάζουν τα host node_modules/.next ώστε να μη
      # μπερδεύονται τα native binaries του Windows με αυτά του container.
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Μέσα στο δίκτυο του compose η βάση λέγεται «postgres», όχι «localhost».
      DATABASE_URL: postgresql://${POSTGRES_USER:-diploma}:${POSTGRES_PASSWORD:-diploma}@postgres:5432/${POSTGRES_DB:-diploma}
      # Ο host είναι Windows: το inotify δεν περνάει από το bind mount, οπότε το
      # file watching γίνεται με polling. Το WATCHPACK_POLLING το διαβάζει μόνο
      # ο webpack — γι' αυτό το dev stage τρέχει `next dev --webpack`.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:?ορίστε AUTH_SECRET στο .env}
      AUTH_KEYCLOAK_ID: diploma-app
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-diploma-app-secret}
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/diploma
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/diploma
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: ${S3_BUCKET:-diploma}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-diploma-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-diploma-app-secret}

volumes:
  postgres-data:
  keycloak-data:
  minio-data:
