# Development stack — hot reload μέσα σε container.
#   docker compose -f docker-compose.dev.yml up
#
# Το production compose (docker-compose.yml) μένει ανέπαφο· τα δύο αρχεία δεν
# συνδυάζονται, διαλέγεις ένα από τα δύο.

services:
  # Ίδια εικόνα και ίδιος named volume με το docker-compose.yml, οπότε τα δεδομένα
  # είναι τα ίδια είτε τρέξεις dev είτε prod.
  postgres:
    image: postgres:16.4-alpine
    container_name: diploma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diploma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diploma}
      POSTGRES_DB: ${POSTGRES_DB:-diploma}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diploma} -d ${POSTGRES_DB:-diploma}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Ίδιο one-shot service με το docker-compose.yml: χωρίς αυτό η διαδρομή Γ
  # ξεκινά με άδεια βάση σε καθαρό μηχάνημα.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: diploma-migrate
    container_name: diploma-migrate-dev
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-diploma}:${POSTGRES_PASSWORD:-diploma}@postgres:5432/${POSTGRES_DB:-diploma}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: dev
    container_name: dev
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      # Ο πηγαίος κώδικας από τον host — κάθε αλλαγή φαίνεται αμέσως.
      - .:/app
      # Anonymous volumes: σκιάζουν τα host node_modules/.next ώστε να μη
      # μπερδεύονται τα native binaries του Windows με αυτά του container.
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      # Μέσα στο δίκτυο του compose η βάση λέγεται «postgres», όχι «localhost».
      DATABASE_URL: postgresql://${POSTGRES_USER:-diploma}:${POSTGRES_PASSWORD:-diploma}@postgres:5432/${POSTGRES_DB:-diploma}
      # Ο host είναι Windows: το inotify δεν περνάει από το bind mount, οπότε το
      # file watching γίνεται με polling. Το WATCHPACK_POLLING το διαβάζει μόνο
      # ο webpack — γι' αυτό το dev stage τρέχει `next dev --webpack`.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

volumes:
  postgres-data:
